<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" role="img" aria-labelledby="title desc">
  <title id="title">个人照片占位图</title>
  <desc id="desc">柔和灰绿色调的抽象人物照片占位图，可替换为真实照片。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef1f5"/>
      <stop offset=".52" stop-color="#d3dae3"/>
      <stop offset="1" stop-color="#aeb9c7"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".78"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
  <rect width="800" height="900" fill="url(#bg)"/>
  <circle cx="660" cy="120" r="210" fill="#f9fafc" opacity=".7" filter="url(#blur)"/>
  <path d="M0 620C160 520 290 570 430 490s260-42 370-110v520H0Z" fill="#8b98aa" opacity=".34"/>
  <path d="M0 700c150-85 290-48 430-121 142-74 256-28 370-82v403H0Z" fill="#687587" opacity=".28"/>
  <ellipse cx="421" cy="377" rx="112" ry="135" fill="#e9d2bd"/>
  <path d="M310 365c4-102 50-170 122-170 82 0 126 75 111 188-22-47-62-77-121-84-31 42-68 62-112 66Z" fill="#35383d"/>
  <path d="M256 900c13-215 68-339 166-339 106 0 167 124 183 339Z" fill="#384454"/>
  <path d="M335 510c20 35 50 54 88 54 39 0 69-19 90-57-9 81-38 128-90 128-51 0-80-43-88-125Z" fill="#dfbda5" opacity=".75"/>
  <rect width="800" height="430" fill="url(#light)" opacity=".22"/>
  <g fill="#fff" opacity=".78" font-family="Arial, sans-serif">
    <text x="42" y="66" font-size="15" letter-spacing="4">PORTRAIT PLACEHOLDER</text>
    <text x="42" y="840" font-size="13" letter-spacing="3">REPLACE WITH YOUR PHOTO</text>
  </g>
</svg>
